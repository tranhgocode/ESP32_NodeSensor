model:
  name: conv1d_gru
  input_shape: [null, 3]  # [time_steps, features], channels follow common.yaml data.features

  layers:
    - {type: Conv1D, filters: 128, kernel_size: 3, dilation_rate: 1,  padding: same, activation: relu}
    - {type: Conv1D, filters: 64,  kernel_size: 3, dilation_rate: 2,  padding: same, activation: relu}
    - {type: Conv1D, filters: 32,  kernel_size: 3, dilation_rate: 4,  padding: same, activation: relu}
    - {type: Conv1D, filters: 16,  kernel_size: 3, dilation_rate: 8,  padding: same, activation: relu}
    - {type: Conv1D, filters: 8,   kernel_size: 3, dilation_rate: 16, padding: same, activation: relu}

    - {type: GRU, units: 64}
    - {type: Dense, units: 256, activation: relu}
    - {type: Dropout, rate: 0.2}
    - {type: Dense, units: 4}
