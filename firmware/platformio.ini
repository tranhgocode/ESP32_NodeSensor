# PlatformIO Project Configuration File
#
#   Build options: build flags, source filter
#   Upload options: custom upload port, speed and extra flags
#   Library options: dependencies, extra library storages
#   Advanced options: extra scripting
#
# Please visit documentation for the other options and examples
# https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = espidf

monitor_speed = 115200
# Keep serial control lines inactive while monitoring USB Serial/JTAG.
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
upload_protocol = esptool

board_upload.flash_size = 16MB

# ESP-IDF component dependencies are declared in src/idf_component.yml.
platform_packages =
    platformio/framework-espidf@4.60100.0
    platformio/toolchain-xtensa-esp-elf@15.2.0+20251204
    platformio/toolchain-riscv32-esp@15.2.0+20251204

# Run portable tests on the host without ESP32 framework or dependencies.
[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_flags =
    -std=c11
    -Wall
    -Wextra
    -I src
    # 32-bit MinGW supports int64_t, but Unity needs 64-bit assertions enabled.
    -D UNITY_SUPPORT_64
    # Keep host scheduling checks independent of the local measurement setting.
    -DNODE_MEASUREMENT_INTERVAL_MS=300000
build_src_filter =
    -<*>
    +<protocol/*.c>
    +<app/node_state.c>
    +<app/node_app.c>
test_filter =
    test_protocol
    test_node
    test_cycle

# Test the DHT11 adapter against fake GPIO/DHT functions on the host.
# Keep fake ESP-IDF headers out of the portable native environment.
[env:native_sensor]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -I test/test_dht11/fakes
    -I managed_components/esp-idf-lib__dht
build_src_filter =
    -<*>
    +<sensor/dht11.c>
test_filter = test_dht11

# Exercise the real SX127x source with host-only GPIO/SPI/RTOS boundaries.
[env:native_radio]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -I test/test_radio/fakes
    -I managed_components/dernasherbrezon__sx127x/include
extra_scripts = pre:test/test_radio/build_vendor.py
build_src_filter =
    -<*>
    +<radio/node_radio.c>
test_filter = test_radio

# Exercise Light-sleep and the GPIO indicator through host-only ESP-IDF boundaries.
[env:native_power]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -Werror
    -I test/test_power_indicator/fakes
build_src_filter =
    -<*>
    +<power/node_power.c>
    +<indicator/status_led.c>
    +<app/node_state.c>
test_filter = test_power_indicator

# Run the real entry point, platform and orchestrator against host driver boundaries.
[runtime_common]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -Werror
    -Wl,--wrap=fflush
    -Wl,--wrap=fsync
    -I test/test_runtime/fakes
    -I test/test_power_indicator/fakes
build_src_filter =
    -<*>
    +<main.c>
    +<platform/node_platform.c>
    +<sensor/select_sensor.c>
    +<app/*.c>
    +<protocol/*.c>
test_filter = test_runtime

[env:native_runtime]
extends = runtime_common
build_flags =
    ${runtime_common.build_flags}
    -DNODE_TEMP_HUM_SENSOR=1

# Verify the same runtime behavior with application logging disabled.
[env:native_runtime_no_trace]
extends = env:native_runtime
build_flags =
    ${env:native_runtime.build_flags}
    -DIS_DEBUG_TRACE_LOG=0

# Exercise battery ADC and calibration through host fakes.
[env:native_battery]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -Werror
    -I test/test_battery/fakes
build_src_filter =
    -<*>
    +<sensor/battery.c>
test_filter = test_battery

# Exercise HM3301 with GPIO, I2C and monotonic clock boundaries.
[env:native_hm3301]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -Werror
    -I test/test_hm3301/fakes
build_src_filter =
    -<*>
    +<sensor/hmi3301.c>
    +<platform/node_i2c.c>
test_filter = test_hm3301

[env:native_i2c]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -Werror
    -I test/test_hm3301/fakes
build_src_filter =
    -<*>
    +<platform/node_i2c.c>
test_filter = test_node_i2c

[env:native_sht30]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -Werror
    -I test/test_hm3301/fakes
    -I test/test_power_indicator/fakes
build_src_filter =
    -<*>
    +<sensor/sht30.c>
    +<platform/node_i2c.c>
test_filter = test_sht30

[env:native_sht30_address45]
extends = env:native_sht30
build_flags =
    ${env:native_sht30.build_flags}
    -DNODE_SHT30_I2C_ADDRESS=0x45

[sensor_select_common]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -Werror
build_src_filter =
    -<*>
    +<sensor/select_sensor.c>
test_filter = test_node_sensor

[env:native_sensor_select_dht11]
extends = sensor_select_common
build_flags =
    ${sensor_select_common.build_flags}
    -DNODE_TEMP_HUM_SENSOR=1

[env:native_i2c_sensors]
extends = env:native_sht30
build_src_filter =
    ${env:native_sht30.build_src_filter}
    +<sensor/hmi3301.c>
test_filter = test_i2c_sensors

[env:native_i2c_sensors_address45]
extends = env:native_i2c_sensors
build_flags =
    ${env:native_sht30.build_flags}
    -DNODE_SHT30_I2C_ADDRESS=0x45

[env:native_sensor_select_sht30]
extends = sensor_select_common
build_flags =
    ${sensor_select_common.build_flags}
    -DNODE_TEMP_HUM_SENSOR=2

[env:native_runtime_hm3301]
extends = env:native_runtime
build_flags =
    ${env:native_runtime.build_flags}
    -DNODE_HM3301_ENABLED=1

[env:native_runtime_hm3301_no_trace]
extends = env:native_runtime_hm3301
build_flags =
    ${env:native_runtime_hm3301.build_flags}
    -DIS_DEBUG_TRACE_LOG=0

[env:native_runtime_sht30]
extends = runtime_common
build_flags =
    ${runtime_common.build_flags}
    -DNODE_TEMP_HUM_SENSOR=2

[env:native_runtime_sht30_no_trace]
extends = env:native_runtime_sht30
build_flags =
    ${env:native_runtime_sht30.build_flags}
    -DIS_DEBUG_TRACE_LOG=0

[env:native_runtime_sht30_hm3301]
extends = env:native_runtime_sht30
build_flags =
    ${env:native_runtime_sht30.build_flags}
    -DNODE_HM3301_ENABLED=1

[env:native_runtime_sht30_hm3301_no_trace]
extends = env:native_runtime_sht30_hm3301
build_flags =
    ${env:native_runtime_sht30_hm3301.build_flags}
    -DIS_DEBUG_TRACE_LOG=0
