; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = espidf

monitor_speed = 115200
upload_speed = 460800
upload_protocol = esptool

board_upload.flash_size = 16MB

; ESP-IDF component dependencies are declared in src/idf_component.yml.
platform_packages =
    platformio/framework-espidf@4.60100.0
    platformio/toolchain-xtensa-esp-elf@15.2.0+20251204
    platformio/toolchain-riscv32-esp@15.2.0+20251204

; Run portable tests on the host without ESP32 framework or dependencies.
[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_flags =
    -std=c11
    -Wall
    -Wextra
    -I src
    ; 32-bit MinGW supports int64_t, but Unity needs 64-bit assertions enabled.
    -D UNITY_SUPPORT_64
build_src_filter =
    -<*>
    +<protocol/*.c>
    +<app/node_state.c>
test_filter =
    test_protocol
    test_node
    test_cycle
