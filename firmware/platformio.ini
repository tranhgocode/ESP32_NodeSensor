# Cấu hình dự án PlatformIO.
# https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = espidf
extra_scripts = post:extra_scripts/pm25_model.py

monitor_speed = 115200
# Tắt DTR và RTS khi mở màn hình USB Serial/JTAG.
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
upload_protocol = esptool

board_upload.flash_size = 16MB

# Phụ thuộc ESP-IDF được khai báo trong src/idf_component.yml.
platform_packages =
    platformio/framework-espidf@4.60100.0
    platformio/toolchain-xtensa-esp-elf@15.2.0+20251204
    platformio/toolchain-riscv32-esp@15.2.0+20251204

# Đặt mốc đo cách nhau 120 giây, mỗi mốc ứng với một bước đầu vào của mô hình.
[env:esp32-s3-devkitc-1-forecast-demo]
extends = env:esp32-s3-devkitc-1
build_src_flags = -DNODE_PM25_FORECAST_DEMO=1
