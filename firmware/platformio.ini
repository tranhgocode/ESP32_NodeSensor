# Cấu hình dự án PlatformIO.
# https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = espidf
extra_scripts = post:extra_scripts/pm25_model.py

monitor_speed = 115200
# Tắt DTR và RTS khi mở màn hình USB Serial/JTAG.
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
upload_protocol = esptool

board_upload.flash_size = 16MB

# Phụ thuộc ESP-IDF được khai báo trong src/idf_component.yml.
platform_packages =
    platformio/framework-espidf@4.60100.0
    platformio/toolchain-xtensa-esp-elf@15.2.0+20251204
    platformio/toolchain-riscv32-esp@15.2.0+20251204

# Đặt mốc đo cách nhau 120 giây, mỗi mốc ứng với một bước đầu vào của mô hình.
[env:esp32-s3-devkitc-1-forecast-demo]
extends = env:esp32-s3-devkitc-1
build_src_flags = -DNODE_PM25_FORECAST_DEMO=1

# Kiểm thử logic trên máy tính, không cần ESP-IDF.
[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_flags =
    -std=c11
    -Wall
    -Wextra
    -I src
    # Bật phép so sánh 64 bit của Unity trên MinGW 32 bit.
    -D UNITY_SUPPORT_64
    # Dùng chu kỳ cố định để cấu hình cục bộ không ảnh hưởng bài kiểm thử.
    -DNODE_MEASUREMENT_INTERVAL_MS=300000
build_src_filter =
    -<*>
    +<protocol/*.c>
    +<app/node_state.c>
    +<app/node_app.c>
    +<forecast/pm25_history.c>
test_filter =
    test_protocol
    test_node
    test_cycle
    test_pm25_forecast

# Kiểm thử DHT11 bằng các hàm GPIO và DHT giả lập.
[env:native_sensor]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -I test/test_dht11/fakes
    -I managed_components/esp-idf-lib__dht
build_src_filter =
    -<*>
    +<sensor/dht11.c>
test_filter = test_dht11

# Kiểm thử mã SX127x thật với GPIO, SPI và RTOS giả lập.
[env:native_radio]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -I test/test_radio/fakes
    -I managed_components/dernasherbrezon__sx127x/include
extra_scripts = pre:test/test_radio/build_vendor.py
build_src_filter =
    -<*>
    +<radio/node_radio.c>
test_filter = test_radio

# Kiểm thử Light-sleep và LED với ESP-IDF giả lập.
[env:native_power]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -Werror
    -I test/test_power_indicator/fakes
build_src_filter =
    -<*>
    +<power/node_power.c>
    +<indicator/status_led.c>
    +<app/node_state.c>
test_filter = test_power_indicator

# Kiểm thử luồng ứng dụng thật với trình điều khiển giả lập.
[runtime_common]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -Werror
    -Wl,--wrap=fflush
    -Wl,--wrap=fsync
    -DNODE_PM25_FORECAST_ENABLED=0
    -I test/test_runtime/fakes
    -I test/test_power_indicator/fakes
build_src_filter =
    -<*>
    +<main.c>
    +<platform/node_platform.c>
    +<sensor/select_sensor.c>
    +<app/*.c>
    +<protocol/*.c>
test_filter = test_runtime

[env:native_runtime]
extends = runtime_common
build_flags =
    ${runtime_common.build_flags}
    -DNODE_TEMP_HUM_SENSOR=1

# Kiểm thử luồng ứng dụng khi tắt log.
[env:native_runtime_no_trace]
extends = env:native_runtime
build_flags =
    ${env:native_runtime.build_flags}
    -DIS_DEBUG_TRACE_LOG=0

# Kiểm thử đọc ADC và hiệu chuẩn pin bằng hàm giả lập.
[env:native_battery]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -Werror
    -I test/test_battery/fakes
build_src_filter =
    -<*>
    +<sensor/battery.c>
test_filter = test_battery

# Kiểm thử HM3301 với GPIO, I2C và đồng hồ giả lập.
[env:native_hm3301]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -Werror
    -I test/test_hm3301/fakes
build_src_filter =
    -<*>
    +<sensor/hmi3301.c>
    +<platform/node_i2c.c>
test_filter = test_hm3301

[env:native_i2c]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -Werror
    -I test/test_hm3301/fakes
build_src_filter =
    -<*>
    +<platform/node_i2c.c>
test_filter = test_node_i2c

[env:native_sht30]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -Werror
    -I test/test_hm3301/fakes
    -I test/test_power_indicator/fakes
build_src_filter =
    -<*>
    +<sensor/sht30.c>
    +<platform/node_i2c.c>
test_filter = test_sht30

[env:native_sht30_address45]
extends = env:native_sht30
build_flags =
    ${env:native_sht30.build_flags}
    -DNODE_SHT30_I2C_ADDRESS=0x45

[sensor_select_common]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -Werror
build_src_filter =
    -<*>
    +<sensor/select_sensor.c>
test_filter = test_node_sensor

[env:native_sensor_select_dht11]
extends = sensor_select_common
build_flags =
    ${sensor_select_common.build_flags}
    -DNODE_TEMP_HUM_SENSOR=1

[env:native_i2c_sensors]
extends = env:native_sht30
build_src_filter =
    ${env:native_sht30.build_src_filter}
    +<sensor/hmi3301.c>
test_filter = test_i2c_sensors

[env:native_i2c_sensors_address45]
extends = env:native_i2c_sensors
build_flags =
    ${env:native_sht30.build_flags}
    -DNODE_SHT30_I2C_ADDRESS=0x45

[env:native_sensor_select_sht30]
extends = sensor_select_common
build_flags =
    ${sensor_select_common.build_flags}
    -DNODE_TEMP_HUM_SENSOR=2

[env:native_runtime_hm3301]
extends = env:native_runtime
build_flags =
    ${env:native_runtime.build_flags}
    -DNODE_HM3301_ENABLED=1

[env:native_runtime_hm3301_no_trace]
extends = env:native_runtime_hm3301
build_flags =
    ${env:native_runtime_hm3301.build_flags}
    -DIS_DEBUG_TRACE_LOG=0

[env:native_runtime_sht30]
extends = runtime_common
build_flags =
    ${runtime_common.build_flags}
    -DNODE_TEMP_HUM_SENSOR=2

[env:native_runtime_sht30_no_trace]
extends = env:native_runtime_sht30
build_flags =
    ${env:native_runtime_sht30.build_flags}
    -DIS_DEBUG_TRACE_LOG=0

[env:native_runtime_sht30_hm3301]
extends = env:native_runtime_sht30
build_flags =
    ${env:native_runtime_sht30.build_flags}
    -DNODE_HM3301_ENABLED=1

[env:native_runtime_sht30_hm3301_no_trace]
extends = env:native_runtime_sht30_hm3301
build_flags =
    ${env:native_runtime_sht30_hm3301.build_flags}
    -DIS_DEBUG_TRACE_LOG=0
