; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = espidf

monitor_speed = 115200
upload_speed = 460800
upload_protocol = esptool

board_upload.flash_size = 16MB

; ESP-IDF component dependencies are declared in src/idf_component.yml.
platform_packages =
    platformio/framework-espidf@4.60100.0
    platformio/toolchain-xtensa-esp-elf@15.2.0+20251204
    platformio/toolchain-riscv32-esp@15.2.0+20251204

; Run portable tests on the host without ESP32 framework or dependencies.
[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_flags =
    -std=c11
    -Wall
    -Wextra
    -I src
    ; 32-bit MinGW supports int64_t, but Unity needs 64-bit assertions enabled.
    -D UNITY_SUPPORT_64
build_src_filter =
    -<*>
    +<protocol/*.c>
    +<app/node_state.c>
test_filter =
    test_protocol
    test_node
    test_cycle

; Test the DHT11 adapter against fake GPIO/DHT functions on the host.
; Keep fake ESP-IDF headers out of the portable native environment.
[env:native_sensor]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -I test/test_dht11/fakes
    -I managed_components/esp-idf-lib__dht
build_src_filter =
    -<*>
    +<sensor/dht11.c>
test_filter = test_dht11

; Exercise the real SX127x source with host-only GPIO/SPI/RTOS boundaries.
[env:native_radio]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -I test/test_radio/fakes
    -I managed_components/dernasherbrezon__sx127x/include
extra_scripts = pre:test/test_radio/build_vendor.py
build_src_filter =
    -<*>
    +<radio/node_radio.c>
test_filter = test_radio
